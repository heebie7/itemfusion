name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup jdk 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: install gradle 8.1.1
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.1.1-bin.zip
          unzip -q /tmp/gradle.zip -d $HOME/gradle-dist
          echo "$HOME/gradle-dist/gradle-8.1.1/bin" >> $GITHUB_PATH

      - name: build
        run: gradle build --stacktrace --no-daemon

      - name: list built jars
        run: ls -la build/libs/

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: itemfusion-jar
          path: build/libs/*.jar

      - name: publish latest release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: build/libs/*.jar
